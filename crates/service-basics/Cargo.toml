# SPDX-License-Identifier: MIT

[package]
name = "service-basics"
description = "What every Rust port of a gluon service needs at runtime: environment, shutdown, config, Postgres, plain-text errors, health."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
service-testing = { path = "../service-testing" }
tower = { version = "0.5", features = ["util"] }
