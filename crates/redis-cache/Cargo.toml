# SPDX-License-Identifier: MIT

[package]
name = "redis-cache"
description = "A Redis cache-aside client for the Rust ports that fails fast while Redis is down and reconnects once it is back."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
service-testing = { path = "../service-testing" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
